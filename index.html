    <meta charset="UTF-8" />

    <meta name="description" content="A high-end, structured redesign of Notion's project management experience focusing on project health, task velocity, milestones, deadlines, and team workload." />
    <meta property="og:title" content="WAYPOINT — Project Workspace" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('waypoint_v1_theme') || 'light';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F6F4] dark:bg-[#0A0A0A] text-[#141416] dark:text-[#E2E2E2] font-sans antialiased transition-colors duration-200 selection:bg-white selection:text-black dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
